<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPOT - STEP Purchasing Online Tool</title>
    <!-- Pasang tema sebelum aplikasi dimuat supaya mode gelap tidak "berkedip" putih.
         Kunci & default harus sama dengan src/lib/theme.tsx -->
    <script>
      (function () {
        var theme = "light";
        try { theme = localStorage.getItem("spot-theme") || "light"; } catch (e) {}
        if (theme === "system") theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(theme === "dark" ? "dark" : "light");
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
